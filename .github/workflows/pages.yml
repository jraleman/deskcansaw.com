# Deploys the site to GitHub Pages by building the branch it is served from:
# the committed files, the games exported from the dcs_games submodule into
# play/, and the collection's desktop builds into downloads/. Setting it up is
# under "Deploying" in README.md: Pages set to deploy from the gh-pages branch,
# and a DCS_GAMES_TOKEN secret that can read the private game repos.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is a branch of this repo rather than an artifact, so the deploy
# writes to the repo instead of uploading anything.
permissions:
  contents: write

# One deploy at a time. The branch is force-pushed, so two at once would race;
# a newer push waits for the running one instead of cancelling it halfway
# through a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      # The branch Pages serves. Nothing on it is written by hand: every deploy
      # replaces it with one commit that has no history behind it, so the builds
      # it replaces don't pile up in the repo.
      PAGES_BRANCH: gh-pages
    steps:
      - name: Check for the games token
        env:
          DCS_GAMES_TOKEN: ${{ secrets.DCS_GAMES_TOKEN }}
        run: |
          if [ -z "$DCS_GAMES_TOKEN" ]; then
            echo "::warning title=No DCS_GAMES_TOKEN secret::The checkout can't read private game repos without it. See Deploying in README.md."
          fi

      # The token is used for this repo too: checkout takes one for everything.
      # The game repos' SSH URLs are fetched over HTTPS with it.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.DCS_GAMES_TOKEN || github.token }}
          persist-credentials: false

      - name: Check the pages match content/site.json
        run: python3 tools/build.py --check

      - name: Cache Godot and its export templates
        uses: actions/cache@v6
        with:
          path: .cache/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-web-desktop
          restore-keys: godot-${{ env.GODOT_VERSION }}-linux-

      - name: Install Godot
        run: |
          dir=".cache/godot/editor/$GODOT_VERSION"
          name="Godot_v${GODOT_VERSION}_linux.x86_64"
          if [ ! -f "$dir/$name" ]; then
            mkdir -p "$dir"
            base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
            curl -fsSL --retry 3 -o "$dir/$name.zip" "$base/$name.zip"
            curl -fsSL --retry 3 -o "$dir/SHA512-SUMS.txt" "$base/SHA512-SUMS.txt"
            (cd "$dir" && grep "  $name.zip\$" SHA512-SUMS.txt | sha512sum -c -)
            unzip -q -o "$dir/$name.zip" -d "$dir"
            rm "$dir/$name.zip" "$dir/SHA512-SUMS.txt"
          fi
          chmod +x "$dir/$name"
          echo "GODOT=$PWD/$dir/$name" >> "$GITHUB_ENV"

      # The committed files, as the branch serves them. git archive leaves an
      # empty folder where the submodule is. What is git's rather than the
      # site's comes off too: .gitignore names play/ and downloads/, which are
      # exactly what the branch has to commit, and the workflows belong on main.
      # .nojekyll is committed, but a branch without it is served through Jekyll,
      # so it isn't left to chance.
      - name: Put the site together
        run: |
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/dcs_games _site/.github
          rm -f _site/.gitignore _site/.gitmodules
          touch _site/.nojekyll

      - name: Export the games
        run: python3 tools/export_games.py --out _site/play --downloads _site/downloads

      # Everything reaches the branch through git push, which refuses a file
      # over 100 MiB, and a desktop build can land the wrong side of that. A
      # rejected push would take the whole site down with it, so the file is
      # left off and said loudly instead.
      - name: Leave out what a push won't take
        run: |
          too_big=$(find _site -type f -size +100M | sort)
          [ -n "$too_big" ] || exit 0
          printf '### Left off the site\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$too_big" | while IFS= read -r file; do
            path="${file#_site/}"
            size=$(du -h "$file" | cut -f1)
            echo "::warning title=Too big for the branch::$path is $size, over the 100 MiB a push takes, so it is not on the site."
            echo "- \`$path\` — $size, over the 100 MiB a push takes" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$file"
          done

      # A repo of its own, so the commit has no parent and the branch is only
      # ever this one build. The push is the deploy: Pages serves what lands
      # there. GITHUB_TOKEN doesn't start workflows, so this doesn't loop.
      - name: Publish to the branch Pages serves
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b "$PAGES_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7}" \
                        -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          git push -q --force \
            "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "$PAGES_BRANCH"
          printf '\n%s files pushed to `%s`.\n' "$(git ls-files | wc -l)" "$PAGES_BRANCH" \
            >> "$GITHUB_STEP_SUMMARY"
